name: CodeQL

# GitHub's code scanner: looks for security bugs in the app's own code
# (injection, unsafe data handling, ...). Results show under Security > Code scanning.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 3 * * 1' # every Monday

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          queries: security-and-quality

      - uses: github/codeql-action/analyze@v3
