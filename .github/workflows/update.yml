name: OTA update

# Sends JavaScript changes on main to installed apps with EAS Update (no new APK needed).
# Skips itself until the EXPO_TOKEN secret is added.
on:
  push:
    branches: [main]

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      # Crash reporting (sentry.js); a public value, so a repository variable, not a secret.
      EXPO_PUBLIC_SENTRY_DSN: ${{ vars.SENTRY_DSN }}
    steps:
      - name: Skip when EXPO_TOKEN is missing
        if: env.EXPO_TOKEN == ''
        run: echo "::notice::EXPO_TOKEN isn't set yet, so no update was published."

      - uses: actions/checkout@v7
        if: env.EXPO_TOKEN != ''
        with:
          # The release tags, to compare with the APK of this version (check below).
          fetch-depth: 0

      - uses: actions/setup-node@v4
        if: env.EXPO_TOKEN != ''
        with:
          node-version: 22
          cache: npm

      - uses: expo/expo-github-action@v8
        if: env.EXPO_TOKEN != ''
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        if: env.EXPO_TOKEN != ''
        run: npm ci

      # Installed APKs can't run JavaScript that needs native code they don't have, so an update
      # with native changes is refused: that needs a new version and APK instead.
      - name: Check installed apps can run this update
        if: env.EXPO_TOKEN != ''
        run: node scripts/check-native-changes.js

      - name: Publish update
        if: env.EXPO_TOKEN != ''
        run: eas update --channel preview --auto --non-interactive
