name: CI

# Runs on every push and pull request. Three jobs run in parallel:
#   quality   lint (zero warnings) and unit tests
#   build     Expo project health, package versions and an Android bundle
#   security  known vulnerabilities in dependencies, and secrets committed by mistake
on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Lint and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Lint
        run: npx expo lint -- --max-warnings 0

      - name: Unit tests
        run: npx jest --ci

  build:
    name: Expo build check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Check project health
        run: npx expo-doctor

      - name: Check Expo package versions
        run: npx expo install --check

      - name: Bundle the Android app
        run: npx expo export --platform android --output-dir dist

  security:
    name: Security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history, so the secret scan checks every commit

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Fails on any high or critical vulnerability, except the documented ones in .audit-ci.jsonc.
      - name: Dependency vulnerabilities
        run: npx --yes audit-ci@7 --config .audit-ci.jsonc

      - name: Secret scan
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz | tar xz gitleaks
          ./gitleaks git . --config .gitleaks.toml --redact --no-banner --exit-code 1
