name: Refresh episodes

# Keeps the app's data current: AniList's lists (trending, airing, new episodes; data/animeSnapshot.json)
# and the episodes on the official YouTube channels (data/episodes.json).
#
# Automatic: every day at about 06:00 Philippine time. It refreshes the AniList data (free, about a
#   minute), reads the channels' RSS feeds (free, no quota) and only runs the episode search when
#   something new was uploaded. On Sundays it runs the full search, which re-checks every video.
#   Everything that changed arrives as one pull request, or as a commit to main when the repository
#   variable EPISODES_DELIVERY is set to "commit".
# Manual: Actions > Refresh episodes > Run workflow, then pick the mode and the delivery.
#
# Needs the repository secret YOUTUBE_API_KEY. Skips itself until it's added.
on:
  schedule:
    # 21:47 UTC = 05:47 in the Philippines. Off the hour on purpose: GitHub delays scheduled runs that
    # start on the hour, when most others do.
    - cron: '47 21 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'quick: only checks what is new (~5 min). full: re-checks everything, including videos already in the app (15-40 min).'
        type: choice
        options: [quick, full]
        default: quick
      delivery:
        description: 'pull-request: you review and merge. commit: straight to main (then published to phones).'
        type: choice
        options: [pull-request, commit]
        default: pull-request
      skip_feed_check:
        description: 'Run the search even if the RSS feeds show nothing new'
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: refresh-episodes
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      # Crash reporting (sentry.js); a public value, so a repository variable, not a secret.
      EXPO_PUBLIC_SENTRY_DSN: ${{ vars.SENTRY_DSN }}
    steps:
      - name: Skip when YOUTUBE_API_KEY is missing
        if: env.YOUTUBE_API_KEY == ''
        run: echo "::notice::YOUTUBE_API_KEY isn't set yet, so episodes weren't refreshed."

      - uses: actions/checkout@v7
        if: env.YOUTUBE_API_KEY != ''

      - uses: actions/setup-node@v7
        if: env.YOUTUBE_API_KEY != ''
        with:
          node-version: 22

      - name: Choose mode and delivery
        id: plan
        if: env.YOUTUBE_API_KEY != ''
        env:
          INPUT_MODE: ${{ inputs.mode }}
          INPUT_DELIVERY: ${{ inputs.delivery }}
          INPUT_SKIP_FEED_CHECK: ${{ inputs.skip_feed_check }}
          DEFAULT_DELIVERY: ${{ vars.EPISODES_DELIVERY }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            mode="$INPUT_MODE"; delivery="$INPUT_DELIVERY"; check_feeds=$([ "$INPUT_SKIP_FEED_CHECK" = "true" ] && echo false || echo true)
          else
            # Scheduled: the full search on Sundays (Philippine time), otherwise quick.
            mode=$([ "$(TZ=Asia/Manila date +%u)" = "7" ] && echo full || echo quick)
            delivery="${DEFAULT_DELIVERY:-pull-request}"
            check_feeds=$([ "$mode" = "quick" ] && echo true || echo false)
          fi
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "delivery=$delivery" >> "$GITHUB_OUTPUT"
          echo "check_feeds=$check_feeds" >> "$GITHUB_OUTPUT"
          echo "Mode: $mode · delivery: $delivery · RSS check first: $check_feeds"

      # A failure (AniList down) keeps yesterday's data and doesn't stop the episode check.
      - name: Refresh AniList data
        if: env.YOUTUBE_API_KEY != ''
        continue-on-error: true
        run: node scripts/snapshot-anime.js

      - name: Check RSS feeds for new uploads
        id: feeds
        if: env.YOUTUBE_API_KEY != '' && steps.plan.outputs.check_feeds == 'true'
        run: node scripts/check-feeds.js

      - name: Search for episodes
        id: search
        if: env.YOUTUBE_API_KEY != '' && (steps.plan.outputs.check_feeds != 'true' || steps.feeds.outputs.new_videos != '0')
        run: |
          flags="--summary $RUNNER_TEMP/summary.md"
          [ "${{ steps.plan.outputs.mode }}" = "quick" ] && flags="$flags --quick"
          node scripts/find-episodes.js $flags

      # Seasons, movies and specials of each anime, for the Seasons row on anime pages. A failure
      # (AniList down) keeps yesterday's file and doesn't stop the rest.
      - name: Refresh seasons
        if: env.YOUTUBE_API_KEY != ''
        continue-on-error: true
        run: node scripts/seasons.js

      # Searches all of YouTube for free full movies, 30 a day (about 3,000 quota units). Official
      # channels' uploads go into the app; unknown channels are listed for review in the pull
      # request. A failure (quota, API) doesn't stop the rest.
      - name: Search YouTube for free movies
        if: env.YOUTUBE_API_KEY != ''
        continue-on-error: true
        run: node scripts/search-movies.js --summary "$RUNNER_TEMP/movies.md"

      # What changed, for the pull request: the episode summary (if the search ran and found
      # something), the movie search, and a line for fresh AniList data.
      - name: Collect changes
        id: changes
        if: env.YOUTUBE_API_KEY != ''
        run: |
          episodes=$(git diff --quiet -- data/episodes.json && echo false || echo true)
          anilist=$(git diff --quiet -- data/animeSnapshot.json data/seasons.json && echo false || echo true)
          summary="$RUNNER_TEMP/pr-body.md"
          : > "$summary"
          if [ "$episodes" = "true" ] && [ -f "$RUNNER_TEMP/summary.md" ]; then cat "$RUNNER_TEMP/summary.md" >> "$summary"; fi
          movies=$(git diff --quiet -- data/movieSearch.json 2>/dev/null && [ -z "$(git ls-files --others --exclude-standard data/movieSearch.json)" ] && echo false || echo true)
          if [ -s "$RUNNER_TEMP/movies.md" ]; then cat "$RUNNER_TEMP/movies.md" >> "$summary"; fi
          if [ "$anilist" = "true" ]; then
            echo "AniList data refreshed: trending, airing this season, popular, movies, new episodes and seasons." >> "$summary"
          fi
          if [ "$episodes" = "true" ]; then title="New episodes from official YouTube channels"
          else title="Fresh AniList data (trending, airing, new episodes)"; fi
          changed=$([ "$episodes" = "true" ] || [ "$anilist" = "true" ] || [ "$movies" = "true" ] && echo true || echo false)
          echo "changed=$changed" >> "$GITHUB_OUTPUT"
          echo "title=$title" >> "$GITHUB_OUTPUT"
          echo "summary=$summary" >> "$GITHUB_OUTPUT"
          [ "$changed" = "true" ] && cat "$summary" >> "$GITHUB_STEP_SUMMARY" || echo "Nothing new today." >> "$GITHUB_STEP_SUMMARY"

      - name: Open a pull request
        if: steps.changes.outputs.changed == 'true' && steps.plan.outputs.delivery == 'pull-request'
        uses: peter-evans/create-pull-request@v7
        with:
          branch: bot/refresh-episodes
          delete-branch: true
          add-paths: |
            data/episodes.json
            data/finderCache.json
            data/animeSnapshot.json
            data/seasons.json
            data/movieSearch.json
          commit-message: ${{ steps.changes.outputs.title }}
          title: ${{ steps.changes.outputs.title }}
          body-path: ${{ steps.changes.outputs.summary }}
          labels: episodes

      - name: Commit to main
        if: steps.changes.outputs.changed == 'true' && steps.plan.outputs.delivery == 'commit'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/episodes.json data/finderCache.json data/animeSnapshot.json data/seasons.json data/movieSearch.json
          git commit -m "${{ steps.changes.outputs.title }}"
          git push

      # A push made by this workflow doesn't start other workflows, so the over-the-air update that
      # normally follows a push to main is published here.
      - uses: expo/expo-github-action@v8
        if: steps.changes.outputs.changed == 'true' && steps.plan.outputs.delivery == 'commit' && env.EXPO_TOKEN != ''
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Publish the update to phones
        if: steps.changes.outputs.changed == 'true' && steps.plan.outputs.delivery == 'commit' && env.EXPO_TOKEN != ''
        run: |
          npm ci
          git fetch --tags --quiet
          node scripts/check-native-changes.js
          eas update --channel preview --environment preview --message "${{ steps.changes.outputs.title }}" --non-interactive

      - name: Notify people about new episodes
        if: steps.changes.outputs.changed == 'true' && steps.plan.outputs.delivery == 'commit' && env.EXPO_TOKEN != ''
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node scripts/notify-new-episodes.js --before HEAD~1
